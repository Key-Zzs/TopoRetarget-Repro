experiment_id: s1_2a_e0_penetration_stress_v1
stage: S1.2A
description: E0 penetration-active GRAB stress discovery and frozen E0 versus S1 comparison.
output_root: .local/experiments/s1_2a_e0_penetration_stress_v1
grab_root: /mnt/nas/storage/Ref2Dex_storage/GRAB/data/GRAB
mano_root: /mnt/nas/storage/Ref2Dex_storage/shared_assets/body_models/mano
robot_id: artimano_rh
robot_asset_root: third_party/robot_hands/artimano
hand: right
native_fps: 120.0
frame_length: 60
stress_count: 3
max_e0_probe_candidates: 40
max_warm_pass_candidates: 40
probe_frames: [0, 30, 59]
frozen_profiles:
  frame: canonical_keypoint_wrist_v1
  bone: mediapipe21_full_finger_chain_v1
  warm_solver: paper_repro_scipy_trf
  graph: strict_scipy_qhull_v1
  collision_surface: engineering_collision_32_per_geometry
  query: adaptive_active_set_v1
  solver: scipy_slsqp_active_set_contact_rich_v3_fixed
  execution: cached_checkpoint_cpu_float64_v3
  penetration_loss: dense_squared_hinge_deadzone1mm_v2
full_audit:
  required_sample_count: 512
  signed_distance_backend: reference_winding_v1
  solver_backend: convex_hull_exact_solver_only
backend_consistency_gate:
  sign_agreement: 0.99
  reference_gt_1mm_recall: 0.95
  penetration_depth_correlation: 0.95
  gradient_cosine: 0.90
  all_finite: true
acceptance_gate:
  min_clip_improvement: 0.20
  min_clips: 2
  max_penetration_regression: 0.0
  max_contact_f1_drop: 0.05
  max_morphology_rmse_regression_m: 0.0005
  max_jerk_regression: 0.20
resource_limits:
  worker_count: 1
  max_wall_time_per_probe: 1800
  max_wall_time_per_clip: 1800
  max_resume_sessions: 64
  omp_threads: 1
  mkl_threads: 1
  openblas_threads: 1
  numexpr_threads: 1
constraints:
  source_only_filtering: true
  no_source_penetration_ranking: true
  no_s1_leakage: true
  no_result_based_reselection: true
  no_mesh_repair: true
  no_raw_data_modification: true
  preserve_old_s1_artifacts: true
  preserve_g3_g4_pause: true
  preserve_s1_formulation: true
  no_wuji: true
