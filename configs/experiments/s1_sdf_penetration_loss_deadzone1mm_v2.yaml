experiment_id: s1_sdf_penetration_loss_v1
stage: S1
description: Paper-external dense SDF penetration-loss comparison with a 1 mm loss dead zone.
repo_branch: develop/pene-loss
robot: artimano_rh
robot_asset_root: third_party/robot_hands/artimano
hand: right
frame_count: 60
native_fps: 120
source_sequence_policy: fixed_ranges_only
clips:
  G1:
    sequence_id: s1/airplane_lift
    source_file: /mnt/nas/storage/Ref2Dex_storage/GRAB/data/GRAB/grab/s1/airplane_lift.npz
    start_frame: 240
    end_frame: 300
    object_id: primary
    object_mesh: airplane
  G2:
    sequence_id: s1/apple_eat_1
    source_file: /mnt/nas/storage/Ref2Dex_storage/GRAB/data/GRAB/grab/s1/apple_eat_1.npz
    start_frame: 212
    end_frame: 272
    object_id: primary
    object_mesh: apple
frozen_profiles:
  frame: canonical_keypoint_wrist_v1
  bone: mediapipe21_full_finger_chain_v1
  warm_solver: paper_repro_scipy_trf
  graph: strict_scipy_qhull_v1
  collision_surface: engineering_collision_32_per_geometry
  query: adaptive_active_set_v1
  solver: scipy_slsqp_active_set_contact_rich_v3_fixed
  execution: cached_checkpoint_cpu_float64_v3
  penetration_loss: dense_squared_hinge_deadzone1mm_v2
lambda_grid: [0.0, 0.01, 0.1, 1.0]
prescreen_frames: [0, 29, 59]
prescreen_policy: fixed_frames_plus_e0_extrema
full_audit:
  required_sample_count: 512
  signed_distance_backend: reference_winding_v1
  solver_backend: convex_hull_exact_solver_only
constraints:
  preserve_paper_weights: true
  preserve_paper_constraints: true
  preserve_input_hashes: true
  allow_manual_acceptance: false
  run_g3_g4: false
  run_contactpose: false
  allow_raw_data_modification: false
  use_latest_main_artifacts: false
  use_v1_artifacts: false
artifact_roots:
  experiment: .local/experiments/s1_sdf_penetration_loss_v1/v2_deadzone1mm
  reports: .local/experiments/s1_sdf_penetration_loss_v1/reports/v2_deadzone1mm
report_root: .local/experiments/s1_sdf_penetration_loss_v1/reports/v2_deadzone1mm
