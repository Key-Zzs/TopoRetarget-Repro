# H3-B performance candidate. This profile changes only the scheduling of the
# final exact full-surface query: when the immediately preceding active-set
# discovery used the same reference backend, exact x, QuerySet, and frame
# context, that already-computed result is reused as the logical final audit.
# Checkpoint assembly retains its independent exact all-frame validation.
profile_id: wuji_continuous_sequential_fast_exact_v2_h3_audit_reuse_v1
version: "1.0.0"
device: cpu
dtype: float64
cache_mode: exact_x_common_forward
checkpoint_schema: toporetarget.final_retarget_checkpoint.v1
durable_checkpoint_interval_frames: 10
intermediate_checkpoint_mode: append_only_frame_payload_plus_fsync_jsonl
historical_sequence_rewrite: false
initialization_profile: stage7_seed_v1
full_audit_mode: outer_round_and_final
final_audit_scheduling: reuse_exact_reference_discovery_if_identical_v1
variable_scaling: seed_delta_normalized_v1
point_jacobian_backend: analytic_urdf_spatial_v2
signed_distance_gradient: spatial_gradient_chain_rule_v1
sign_backend: lipschitz_certified_cache_with_exact_fallback_v1
strict_recovery: reference_batched_from_primary_result_v1
sdf_tree_leaf_size: 512
role: performance_candidate
math_equivalent: true
final_full_surface_audit: true
paper_objective_unchanged: true
paper_constraints_unchanged: true
continuity_contract_unchanged: true
author_exact: unresolved
recommended: false
stage12_default: false
