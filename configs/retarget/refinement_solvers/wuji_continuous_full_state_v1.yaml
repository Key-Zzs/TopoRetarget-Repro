stationarity_policy: feasible_stationary_v1_deferred
benchmark_grid: [30, 60, 100, 200, 400]
sdf_backend: convex_hull_exact_solver_only
sdf_probe_count: 32
sdf_cross_validation_tolerance_m: 1.0e-8
assumptions:
  - A_REFINEMENT_SOLVER_001
  - A_REFINEMENT_SOLVER_TOLERANCES_001
  - A_REFINEMENT_SDF_BACKEND_001
  - A_REFINEMENT_SOLVER_CONTINUATION_002
  - A_WUJI_PREVIOUS_FINAL_TRANSPORT_001
  - A_WUJI_CHART_CONSISTENT_TEMPORAL_001
  - A_WUJI_CONTINUITY_ACCEPTANCE_001
  - A_WUJI_FIVE_FRAME_WINDOW_001
schema_version: toporetarget.wuji_continuous_profile.v1
role: engineering_extension
artifact_immutable: true
trajectory_continuity_guarantee: true
paper_core_frame_objective: unchanged
paper_core_collision_constraints: unchanged
previous_final_correction_transport: true
base_correction_temporal: true
finger_correction_temporal: true
continuity_acceptance: true
deterministic_retry: true
receding_horizon_window: 5
paper_method: false
paper_consistent_temporal_intent: true
author_exact: unresolved
engineering_extension: true
temporal:
  lambda_corr: 0.25
  translation_scale_m: 0.010
  rotation_scale_rad: 0.08726646259971647
  finger_scale_rad: 0.050
