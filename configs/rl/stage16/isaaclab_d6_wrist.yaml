schema_version: toporetarget.stage16c3.finite_d6_wrist_profiles.v1
implementation: finite_d6_wrist_actuator_v1
engineering_model: abstract_6dof_wrist_not_real_arm
base_asset_policy: reference_frozen_c1_asset_without_mutation
anchor:
  kind: static
selection:
  candidate_order: [conservative, nominal, high_authority_bounded]
  rule: first_two_clip_passing_global_profile_in_frozen_order
  clip_specific_tuning: forbidden
joint:
  type: PhysicsJoint
  constraint_model: D6_via_six_LimitAPI_and_DriveAPI_axes
  axes: [transX, transY, transZ, rotX, rotY, rotZ]
  translation_limits_m: [-0.30, 0.30]
  rotation_limits_deg: [-100.0, 100.0]
  orientation_target: quaternion_then_rotation_log
  euler_residual: forbidden
virtual_fallback:
  implementation: finite_virtual_6d_wrist_actuator_v1
  joint_order:
    [virtual_prismatic_x, virtual_prismatic_y, virtual_prismatic_z,
     virtual_revolute_x, virtual_revolute_y, virtual_revolute_z]
  target_conversion: SE3_target_to_prismatic_and_shortest_rotation_log
  rotation_coordinate: shortest_rotation_log_rad_bounded_below_pi
  rotation_limit_deg: 100.0
  singularity_margin_deg: 80.0
profiles:
  conservative:
    translation_stiffness_npm: 400.0
    translation_damping_ns_per_m: 60.0
    translation_effort_limit_n: 30.0
    translation_velocity_limit_mps: 1.0
    rotation_stiffness_nm_per_rad: 3.0
    rotation_damping_nm_s_per_rad: 0.35
    rotation_effort_limit_nm: 3.0
    rotation_velocity_limit_radps: 4.0
  nominal:
    translation_stiffness_npm: 800.0
    translation_damping_ns_per_m: 100.0
    translation_effort_limit_n: 50.0
    translation_velocity_limit_mps: 1.5
    rotation_stiffness_nm_per_rad: 6.0
    rotation_damping_nm_s_per_rad: 0.60
    rotation_effort_limit_nm: 5.0
    rotation_velocity_limit_radps: 5.0
  high_authority_bounded:
    translation_stiffness_npm: 1200.0
    translation_damping_ns_per_m: 140.0
    translation_effort_limit_n: 70.0
    translation_velocity_limit_mps: 2.0
    rotation_stiffness_nm_per_rad: 9.0
    rotation_damping_nm_s_per_rad: 0.90
    rotation_effort_limit_nm: 7.0
    rotation_velocity_limit_radps: 6.0
