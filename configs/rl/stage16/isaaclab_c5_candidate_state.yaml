    - robot_joint_pos
    - robot_joint_vel
    - robot_root_state
    - object_170105_root_state
    - object_170650_root_state
  task_and_history:
    - clip_index
    - reference_index
    - target_reference_index
    - actions
    - previous_actions
    - second_previous_actions
  controller:
    - joint_target_isaac
    - explicit_wrist_joint_target
    - explicit_wrist_joint_velocity_target
