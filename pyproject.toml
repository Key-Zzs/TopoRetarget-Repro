[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toporetarget"
version = "0.1.0.dev0"
description = "Paper-traceable scaffolding for an independent TopoRetarget reproduction"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "pre-commit>=3.7",
]
future = [
  "scipy>=1.11",
  "trimesh>=4.0",
]
cache = [
  "zarr>=2.16",
  "numcodecs>=0.11",
]
viz = [
  "matplotlib>=3.8",
  "Pillow>=10.0",
]
grab = [
  "smplx>=0.1.28",
  "trimesh>=4.0",
]
robot = [
  "torch>=2.0",
  "trimesh>=4.0",
  "matplotlib>=3.8",
]
geometry = [
  "scipy>=1.11",
  "trimesh>=4.0",
]
retarget = [
  "scipy>=1.11",
  "torch>=2.0",
]

[project.scripts]
toporetarget = "toporetarget.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toporetarget = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "licensed_data: opt-in tests that require local licensed GRAB/MANO resources",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
