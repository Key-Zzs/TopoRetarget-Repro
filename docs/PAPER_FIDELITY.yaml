    test_targets: [tests/unit/test_paper_fidelity.py]
    status: specified_not_implemented
    known_parameters: {equation_number: 5, distance_decay_kappa: 30, unit: inverse_meters}
    unknowns: [zero-neighbor handling]
    assumptions: []
    notes: "kappa is from Appendix A.1 Table 3."
  - id: equation_6
    kind: equation
    title: Weighted Laplacian coordinate
    paper_section: "Sec. 3.4"
    pdf_page: 5
    evidence_summary: "Each vertex coordinate is the weighted sum of edge displacement vectors."
    implementation_targets: [src/toporetarget/geometry/laplacian.py]
    test_targets: [tests/unit/test_paper_fidelity.py]
    status: specified_not_implemented
    known_parameters: {equation_number: 6, unit: meters}
    unknowns: [numeric precision and degenerate graph handling]
    assumptions: []
    notes: "Weights are computed from source vertices and reused for robot vertices."
  - id: equation_7
    kind: equation
    title: Interaction-mesh energy
    paper_section: "Sec. 3.4"
    pdf_page: 5
    evidence_summary: "Mean squared difference between source and robot weighted Laplacian coordinates."
