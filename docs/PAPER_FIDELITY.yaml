paper:
  title: "TopoRetarget: Interaction-Preserving Retargeting for Dexterous Manipulation"
  arxiv_id: "2606.16272"
  version: v2
  pdf_path: docs/TopoRetarget.pdf
  pdf_sha256: 21c06a125430854dcff0d778283963b7fe107c8dfa79e3982639a80c21b206ab
  page_count: 16

audit_contracts:
  stage7_1_warm_start_audit:
    profile: src/toporetarget/workflows/warm_start_audit.py
    formal_stage7_objective_unchanged: true
    source_robot_mapping_audited: true
    contact_proxy_is_ground_truth: false
    diagnostic_ik_is_paper_method: false
    sampled_workspace_is_global_proof: false
    official_artifacts_mutated: false
    official_solver_invocation_count: 0
    assumptions: [A_STAGE7_1_MORPHOLOGY_TARGET_001, A_STAGE7_1_WORKSPACE_SAMPLE_001, A_STAGE7_1_FINAL_ATTRIBUTION_001]
    notes: "Read-only warm-start fidelity, thumb mapping, base alignment, morphology and bounded reachability audit."
  stage9_3_2_canonical_contact:
    profile: configs/audit/contact_distance/reference_winding_v1.yaml
    formal_backend: reference_triangle_winding
    solver_backend_separate: true
    legacy_backend_role: diagnostic_only_superseded
    dense_visual_is_approximation: true
    contact_proxy_is_ground_truth: false
    open_visual_normal_direction: inconclusive
    shadow_profiles_are_paper_method: false
    modifies_equations_1_to_9: false
    modifies_stage10_artifacts: false
  stage9_3_3_shadow_equivalence:
    profile: src/toporetarget/workflows/shadow_equivalence.py
    contract: toporetarget.shadow_equivalence.v1
    diagnostic_only: true
    paper_method: false
    modifies_equations_1_to_9: false
    modifies_stage9_2_profiles: false
    modifies_stage10_artifacts: false
    baseline_gate_required: true
    feasibility_only_equivalence_accepted: false
    mandatory_profiles_run_current: 0
    readiness_current: RETURN_TO_STAGE9_3_2_SHADOW_HARNESS_FIX
    assumptions: [A_SHADOW_NUMERICAL_EQUIVALENCE_001, A_SHADOW_CONTEXT_BINDING_001, A_SHADOW_PROFILE_ISOLATION_001, A_LONG_FINGER_ERROR_ATTRIBUTION_001, A_SHADOW_REGULARIZATION_ABLATION_001]
    notes: "Three official repeats per selected frame failed the fixed numerical gate; no mandatory shadow profile or Stage 9.4 implementation was run."

items:
  - id: equation_1
    kind: equation
    title: Relative bone-direction mismatch
    paper_section: "Sec. 3.2"
    pdf_page: 4
    evidence_summary: "Sum of differences between source and robot relative bone-direction pairs."
    implementation_targets: [src/toporetarget/retarget/frames.py, src/toporetarget/retarget/bones.py, src/toporetarget/retarget/objectives.py]
    test_targets: [tests/unit/test_stage7_bone_direction.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 1, unit: dimensionless, directed_bones: 20, adjacent_pairs: 15}
    unknowns: [wrist-frame axes, bone-pair mapping details, wrist-to-MCP scope]
    assumptions: [A_HAND_FRAME_001, A_BONE_DIRECTION_FRAME_001, A_BONE_PAIR_SET_001, A_ZERO_LENGTH_BONE_POLICY_001]
    notes: "Exact adjacent-direction residual and sum objective are implemented; unpublished frame and topology details remain explicit."
  - id: equation_2
    kind: equation
    title: Warm-start optimization
    paper_section: "Sec. 3.2"
    pdf_page: 4
    evidence_summary: "Per-frame warm start combines bone-direction matching and temporal smoothness."
    implementation_targets: [src/toporetarget/retarget/objectives.py, src/toporetarget/retarget/solver.py, src/toporetarget/retarget/pipeline.py]
    test_targets: [tests/unit/test_stage7_warm_start.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 2, unit: dimensionless}
    unknowns: [first-frame initialization, q/base parameterization, optimizer, bounds, time scaling]
    assumptions: [A_FIRST_FRAME_INITIALIZATION_001, A_WARMSTART_BASE_OBSERVABILITY_001, A_BASE_SEED_ALIGNMENT_001, A_WARMSTART_COORDINATES_001, A_WARMSTART_SOLVER_001, A_WARMSTART_JOINT_LIMITS_001, A_WARMSTART_TIME_DISCRETIZATION_001]
    notes: "lambda_warm and lambda_smooth are loaded from the paper config; remaining solver and base details are engineering assumptions."
  - id: equation_3
    kind: equation
    title: Source and robot interaction vertex sets
    paper_section: "Sec. 3.3"
    pdf_page: 4
    evidence_summary: "Both graphs concatenate 21 hand keypoints with posed object surface samples."
    implementation_targets: [src/toporetarget/retarget/interaction_graph.py, src/toporetarget/geometry/surface_sampling.py]
    test_targets: [tests/unit/test_stage8_interaction.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 3, hand_keypoints: 21, unit: vertices}
    unknowns: [surface sampling algorithm, sampling reuse schedule]
    assumptions: [A_OBJECT_SAMPLING_001, A_OBJECT_SAMPLING_METHOD_001]
    notes: "Stage 8 reuses the audited Stage 6 object-local face+barycentric anchors and concatenates them with canonical source hand points."
  - id: equation_4
    kind: equation
    title: Shared Delaunay interaction graph
    paper_section: "Sec. 3.3"
    pdf_page: 4
    evidence_summary: "Delaunay tetrahedralization is run on source vertices and its edge connectivity is reused."
    implementation_targets: [src/toporetarget/retarget/delaunay.py, src/toporetarget/retarget/interaction_graph.py]
    test_targets: [tests/unit/test_stage8_interaction.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 4, connectivity_reuse: true, unit: graph}
    unknowns: [Delaunay backend and degeneracy behavior]
    assumptions: [A_DELAUNAY_BACKEND_001, A_DELAUNAY_OPTIONS_001, A_DELAUNAY_DEGENERACY_001, A_INTERACTION_EDGE_FILTERING_001, A_INTERACTION_GRAPH_FRAME_001, A_INTERACTION_GRAPH_REBUILD_001]
    notes: "Source-only SciPy/Qhull connectivity is cached and reused for the robot evaluation; graph rebuild is explicit for changed source geometry or object scale."
  - id: equation_5
    kind: equation
    title: Distance-decay edge weights
    paper_section: "Sec. 3.4"
    pdf_page: 5
    evidence_summary: "Unnormalized exponential distance weights are normalized over source-graph neighbors."
    implementation_targets: [src/toporetarget/retarget/graph_weights.py]
    test_targets: [tests/unit/test_stage8_interaction.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 5, distance_decay_kappa: 30, unit: inverse_meters}
    unknowns: [zero-neighbor handling]
    assumptions: [A_LAPLACIAN_WEIGHT_NUMERICS_001]
    notes: "kappa is from Appendix A.1 Table 3."
  - id: equation_6
    kind: equation
    title: Weighted Laplacian coordinate
    paper_section: "Sec. 3.4"
    pdf_page: 5
    evidence_summary: "Each vertex coordinate is the weighted sum of edge displacement vectors."
    implementation_targets: [src/toporetarget/retarget/laplacian.py]
    test_targets: [tests/unit/test_stage8_interaction.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 6, unit: meters}
    unknowns: [numeric precision and degenerate graph handling]
    assumptions: []
    notes: "Weights are computed from source vertices and reused for robot vertices."
  - id: equation_7
    kind: equation
    title: Interaction-mesh energy
    paper_section: "Sec. 3.4"
    pdf_page: 5
    evidence_summary: "Mean squared difference between source and robot weighted Laplacian coordinates."
    implementation_targets: [src/toporetarget/retarget/interaction_objective.py, src/toporetarget/retarget/interaction_evaluation.py]
    test_targets: [tests/unit/test_stage8_interaction.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 7, lambda_interaction_mesh: 500, unit: dimensionless}
    unknowns: [optimizer implementation]
    assumptions: [A_INTERACTION_BASE_DIFFERENTIABILITY_001]
    notes: "The fixed graph loss is evaluated as the exact mean squared Eq. (6) residual over 71 vertices. No Eq. 8 optimization or lambda multiplication is executed in Stage 8."
  - id: equation_8
    kind: equation
    title: Final constrained optimization with slack
    paper_section: "Sec. 3.4"
    pdf_page: 5
    evidence_summary: "Refinement combines interaction-mesh, bone, regularization, and slack penalties under signed-distance constraints."
    implementation_targets: [src/toporetarget/retarget/final_refinement.py, src/toporetarget/cli/retarget.py]
    test_targets: [tests/unit/test_stage9_refinement.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 8, soft_tolerance_m: 0.001, hard_bound_m: 0.030, slack_penalty: 100000, unit: mixed}
    unknowns: [query-set construction, solver termination, joint-limit realization, signed-distance backend]
    assumptions: [A_REFINEMENT_SOLVER_001, A_REFINEMENT_SOLVER_TOLERANCES_001, A_REFINEMENT_SOLVER_CONTINUATION_002, A_REFINEMENT_SOLVER_TERMINATION_002, A_REFINEMENT_QUERY_SET_001, A_COLLISION_ACTIVE_MARGIN_001, A_SDF_CONSTRAINT_JACOBIAN_001, A_REFINEMENT_REFERENCE_SDF_ACCELERATION_001, A_REFINEMENT_EVALUATION_CACHE_001, A_REFINEMENT_BATCHED_JACOBIAN_001, A_REFINEMENT_FULL_AUDIT_SCHEDULING_001]
    notes: "Paper weights and constraint signs are locked; solver, Q_t, active-set continuation, and termination details are explicit engineering assumptions."
  - id: equation_9
    kind: equation
    title: Refinement regularization
    paper_section: "Appendix A.1"
    pdf_page: 12
    evidence_summary: "Temporal regularization plus floating-base translation and rotation priors."
    implementation_targets: [src/toporetarget/retarget/final_refinement.py, configs/retarget/refinement/local_seed_delta_v1.yaml]
    test_targets: [tests/unit/test_stage9_refinement.py]
    status: implemented_with_assumptions
    known_parameters: {equation_number: 9, lambda_reg: 2.5, lambda_base_pos: 100, lambda_base_rot: 1, unit: mixed}
    unknowns: [base rotation parameterization, previous-state coordinate mapping, first-frame policy]
    assumptions: [A_REFINEMENT_BASE_PARAMETERIZATION_001, A_REFINEMENT_BASE_PRIOR_REFERENCE_001, A_REFINEMENT_FIRST_FRAME_001, A_REFINEMENT_COORDINATE_SCALING_001, A_REFINEMENT_SOLVER_VARIABLE_SCALING_001, A_REFINEMENT_TIME_DISCRETIZATION_001, A_REFINEMENT_EXECUTION_DEVICE_001, A_REFINEMENT_CHECKPOINT_RESUME_001, A_REFINEMENT_WALL_TIME_PAUSE_001]
    notes: "The paper names q_base position and rotation but does not specify rotation coordinates or the Eq. 9 reference origin."
  - id: equation_10
    kind: equation
    title: Contact precision metric
    paper_section: "Appendix A.3"
    pdf_page: 12
    evidence_summary: "Mean object-relative position error over ContactPose in-contact hand links."
    implementation_targets: [src/toporetarget/metrics/contactpose.py]
    test_targets: [tests/unit/test_paper_fidelity.py]
    status: specified_not_implemented
    known_parameters: {equation_number: 10, unit: meters}
    unknowns: [ContactPose source annotation access]
    assumptions: [A_CONTACTPOSE_THRESHOLD_001]
    notes: "Attribution follows ContactPose's stated sigmoid, threshold, nearest-bone, and 10-vertex rule."
  - id: equation_11
    kind: equation
    title: Contact alignment metric
    paper_section: "Appendix A.3"
    pdf_page: 13
    evidence_summary: "Mean angular deviation between source and retargeted in-contact bone segments."
    implementation_targets: [src/toporetarget/metrics/contactpose.py]
    test_targets: [tests/unit/test_paper_fidelity.py]
    status: specified_not_implemented
    known_parameters: {equation_number: 11, unit: radians}
    unknowns: [handling of zero-length bone segments]
    assumptions: []
    notes: "The reported Table 1 values are displayed in degrees."
  - id: equation_12
    kind: equation
    title: Penetration depth and frame ratio
    paper_section: "Appendix A.3"
    pdf_page: 13
    evidence_summary: "Maximum positive penetration depth and fraction of frames above 2 mm."
    implementation_targets: [src/toporetarget/metrics/penetration.py]
    test_targets: [tests/unit/test_paper_fidelity.py]
    status: specified_not_implemented
    known_parameters: {equation_number: 12, threshold_m: 0.002, unit: meters}
    unknowns: [robot surface sample count, signed-distance implementation]
    assumptions: [A_HAND_SURFACE_SAMPLES_001, A_SIGNED_DISTANCE_BACKEND_001]
    notes: "The threshold delta is 2 mm in Appendix A.3."

