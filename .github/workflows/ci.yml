name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,viz]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
      - run: python scripts/check_paper_fidelity.py
      - run: git diff --check
